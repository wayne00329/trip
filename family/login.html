<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1729">
  <title>登入家庭行程</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background: radial-gradient(ellipse at top left, #164160, transparent 50%), #0b1729;
      color: #eef6ff;
      font: 1rem/1.6 system-ui, "PingFang TC", "Noto Sans TC", sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: clamp(24px, 6vw, 40px);
      border: 1px solid #335169;
      border-radius: 28px;
      background: #102039;
      box-shadow: 0 24px 70px #050c18a8;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      color: #061620;
      background: #63cff8;
      font-weight: 900;
    }
    h1 { margin: 14px 0 4px; font-size: clamp(1.65rem, 6vw, 2rem); line-height: 1.2; }
    p { margin: 0; color: #b5c7da; }
    form { display: grid; gap: 16px; margin-top: 24px; }
    label { display: grid; gap: 6px; font-weight: 650; }
    input, button { min-width: 0; min-height: 46px; border-radius: 12px; font: inherit; }
    input { padding: 8px 12px; border: 1px solid #678296; color: #eef6ff; background: #0b1729; }
    button { margin-top: 3px; border: 0; color: #061620; background: #63cff8; font-weight: 800; cursor: pointer; }
    button:hover { background: #8bddfa; }
    :focus-visible { outline: 3px solid #a6e5ff; outline-offset: 3px; }
    .error { margin-top: 16px; color: #fecaca; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">旅</span>
    <h1>登入家庭行程</h1>
    <p>請輸入帳號和密碼以編輯行程。</p>
    <!-- LOGIN_ERROR -->
    <form method="post" action="/login">
      <label>帳號 <input name="username" autocomplete="username" maxlength="64" required></label>
      <label>密碼 <input type="password" name="password" autocomplete="current-password" maxlength="128" required></label>
      <button type="submit">登入</button>
    </form>
  </main>
</body>
</html>
