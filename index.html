<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1729">
  <title>登入家庭行程</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background: radial-gradient(ellipse at top left, #164160, transparent 50%), #0b1729;
      color: #eef6ff;
      font: 1rem/1.6 system-ui, "PingFang TC", "Noto Sans TC", sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: clamp(24px, 6vw, 40px);
      border: 1px solid #335169;
      border-radius: 28px;
      background: #102039;
      box-shadow: 0 24px 70px #050c18a8;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      color: #061620;
      background: #63cff8;
      font-weight: 900;
    }
    h1 { margin: 14px 0 4px; font-size: clamp(1.65rem, 6vw, 2rem); line-height: 1.2; }
    p { margin: 0; color: #b5c7da; }
    :focus-visible { outline: 3px solid #a6e5ff; outline-offset: 3px; }
    .open-login { display: block; margin-top: 24px; padding: 10px 14px; border-radius: 12px; background: #63cff8; color: #061620; font-weight: 800; text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">旅</span>
    <h1>登入家庭行程</h1>
    <p>在這台電腦啟動 <code>family/start-family.cmd</code> 後，即可登入編輯行程。</p>
    <a class="open-login" href="http://127.0.0.1:4173/">開啟本機登入頁</a>
  </main>
</body>
</html>
